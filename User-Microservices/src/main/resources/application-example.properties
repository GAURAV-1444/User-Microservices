# ==========================================
# Application Configuration
# ==========================================
spring.application.name=User-Microservice

# ==========================================
# Server Configuration
# ==========================================
server.port=8081

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_microservice_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# NATS Configuration
# ==========================================
nats.url=${NATS_URL:nats://localhost:4222}

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:ThisIsADevelopmentSecretKeyForUserMicroserviceJwt2026}
jwt.expiration=${JWT_EXPIRATION:86400000}